extends: ["spectral:oas"]

rules:
  OAS-001-path-kebab-case:
    description: "API paths must use kebab-case (e.g., /user-profiles, not /userProfiles)"
    severity: error
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        match: "^/([a-z0-9-]+|\\{[a-zA-Z0-9_]+\\})(Path|/[a-z0-9-]+|/\\{[a-zA-Z0-9_]+\\})*$"

  OAS-002-error-responses:
    description: "Operations should define standard 4xx and 5xx error responses"
    severity: error
    # The previous version of this rule used `field: "@key"` + `pattern`,
    # which checks that EVERY response key matches ^(4|5) — that always
    # flagged the required "200" success response too, so no valid spec
    # could ever pass. This version instead asserts "at least one
    # response key matches ^[45]" via the standard JSON Schema
    # not(propertyNames(not(pattern))) idiom, which is the correct way
    # to express an existential (rather than universal) key check.
    given: $.paths..[get,post,put,delete,patch].responses
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          not:
            propertyNames:
              not:
                pattern: "^[45]"

  SEC-001-https-only:
    description: "Server URLs must use HTTPS only"
    severity: error
    given: $.servers[*].url
    then:
      function: pattern
      functionOptions:
        match: "^https://"
