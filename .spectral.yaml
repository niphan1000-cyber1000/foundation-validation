extends: ["spectral:oas"]

rules:
  OAS-001-path-kebab-case:
    description: "API paths must use kebab-case (e.g., /user-profiles, not /userProfiles)"
    severity: error
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        match: "^/([a-z0-9-]+|\\{[a-zA-Z0-9_]+\\})(Path|/[a-z0-9-]+|/\\{[a-zA-Z0-9_]+\\})*$"

  OAS-002-error-responses:
    description: "Operations should define standard 4xx and 5xx error responses"
    severity: error
    given: $.paths..[get,post,put,delete,patch].responses
    then:
      field: "@key"
      function: pattern
      functionOptions:
        match: "^(4|5)"

  SEC-001-https-only:
    description: "Server URLs must use HTTPS only"
    severity: error
    given: $.servers[*].url
    then:
      function: pattern
      functionOptions:
        match: "^https://"
