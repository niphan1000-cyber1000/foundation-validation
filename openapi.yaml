openapi: 3.0.3
info:
  title: Sample API
  version: 1.0.0
  description: Sample API for Foundation Validation
  contact:
    name: API Support
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

security:
  - BearerAuth: []

paths:
  /users:
    get:
      summary: List users
      operationId: listUsers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
                example:
                  - id: "usr_123"
                    name: "John Doe"
                    email: "john@example.com"
                    createdAt: "2026-01-01T00:00:00Z"
    post:
      summary: Create user
      operationId: createUser
      responses:
        '201':
          description: Created

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT Bearer token

  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
