openapi: 3.0.3
info:
  title: Sample API
  version: 0.1.0
  description: API for testing governance and security compliance.
  contact:
    name: API Support
    email: support@example.com
  x-domain: "core"
  x-governance-id: "GOV-001"
  x-owner: "team-api@example.com"
servers:
  - url: https://api.example.com
    description: Production server
tags:
  - name: Example
    description: Operations about examples
security:
  - ApiKeyAuth: []
paths:
  /v1/example:
    get:
      summary: Example endpoint
      description: Retrieve sample example data endpoint for testing governance validation.
      operationId: getExampleData
      tags:
        - Example
      parameters:
        - name: apiKey
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
