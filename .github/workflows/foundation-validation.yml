name: Foundation Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run All Domain Unit & Integration Tests
        env:
          PYTHONPATH: .
        run: |
          python3 -m unittest discover -s validators -p "test_*.py"

      - name: Run Aggregator Master Gate CLI
        env:
          PYTHONPATH: .
        run: |
          python3 validators/run_all.py --output validation-result.json
