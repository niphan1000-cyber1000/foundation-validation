name: Foundation Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Schema Engine Unit Tests
        run: |
          python3 -m unittest discover -s validators/schema/tests -p "test_*.py"

      - name: Run Schema Validator CLI
        run: |
          python3 validators/schema/run.py --schema schemas/validation-result.schema.json --target validators/schema/tests/fixtures/valid_result.json
