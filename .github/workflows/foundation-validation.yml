name: Foundation Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Schema Engine Unit Tests
        run: |
          python3 -m unittest discover -s validators/schema/tests -p "test_*.py"

      - name: Run OpenAPI Engine Unit Tests
        run: |
          python3 -m unittest discover -s validators/openapi/tests -p "test_*.py"

      - name: Run Policy Engine Unit Tests
        run: |
          python3 -m unittest discover -s validators/policy/tests -p "test_*.py"

      - name: Run Aggregator Integration Tests
        run: |
          python3 -m unittest discover -s validators/tests -p "test_*.py"

      - name: Run Aggregator Master Gate CLI
        run: |
          python3 validators/run_all.py --output validation-result.json
