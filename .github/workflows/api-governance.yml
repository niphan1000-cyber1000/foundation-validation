name: API Governance Gate

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]

jobs:
  governance-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Prove ERROR Test (Fail-closed Verification)
        run: |
          # จำลองสถานการระบบขัดข้อง เช่น ส่งค่า argument ที่ทำให้เกิด exception หรือจำลองเครื่องมือล่ม
          python run_all.py --test-system-error || python run_all.py --simulate-error
