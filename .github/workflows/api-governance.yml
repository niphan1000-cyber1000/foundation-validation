name: API Governance Gate

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]

jobs:
  governance-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Prove FAIL Injection Test
        run: |
          # บังคับทดสอบด้วยไฟล openapi-bad.yaml เพื่อพิสจนว่าเกตต้องบลอกและสั่ง Exit Non-Zero
          python run_all.py --spec openapi-bad.yaml || python run_all.py --test-failure-injection
