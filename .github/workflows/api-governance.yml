name: API Governance Gate

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]

jobs:
  governance-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Prove ERROR (Fail-closed System Crash Test)
        run: |
          # บังคับรันด้วยไฟลปลอมที่ไม่ตัวตน เพื่อให้ระบบเกิด Exception และต้อง Exit Non-Zero เท่านั้น ห้ามผ่านเดดขาด
          python run_all.py --spec non-existent-file-for-error-test.json || exit 1
