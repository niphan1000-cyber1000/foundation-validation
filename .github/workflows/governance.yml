name: API Governance Gate

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]

jobs:
  governance-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node (for Spectral CLI via npx)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install OPA CLI
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Run unit tests (pure gate-decision logic + aggregator contract)
        run: |
          python -m pytest tests/ validators/tests/ -v

      - name: Run Governance Gate against openapi.json
        run: |
          python validators/run_all.py --spec openapi.json --sarif results.sarif --output validation-result.json

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Verify gate blocks a known-bad spec (negative control)
        run: |
          set +e
          python validators/run_all.py --spec openapi-bad-example.json --output /tmp/negative-control-result.json
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::Negative control FAILED: gate exited 0 on a known-bad spec (openapi-bad-example.json). The gate is not enforcing anything."
            exit 1
          fi
          echo "Negative control passed: gate correctly blocked the bad spec (exit $STATUS)."